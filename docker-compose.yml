services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uv run gunicorn docintel.config.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docintel.config.settings.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: uv run celery -A docintel.config.celery worker -Q default,ocr -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docintel.config.settings.docker
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: uv run celery -A docintel.config.celery beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: docintel.config.settings.docker
    depends_on:
      - redis

  localstack:
    image: localstack/localstack:4
    profiles: ["aws"]
    environment:
      SERVICES: s3,textract,ses,sns
    ports:
      - "4566:4566"
